services:
  broker-monitoreo:
    image: ghcr.io/juan-cerda-duoc/monitoreo-basura-ia:latest
    build: .
    container_name: monitoreo-ia
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # --- DESCOMENTAR EN LINUX O RASPBERRY PI ---
    # devices:
    #   - "/dev/video0:/dev/video0"
    #   - "/dev/ttyUSB0:/dev/ttyUSB0"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: monitoreo-cloudflare
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://broker-monitoreo:5000
    depends_on:
      - broker-monitoreo