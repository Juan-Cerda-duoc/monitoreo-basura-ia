services:
  broker-monitoreo:
    build: .
    container_name: monitoreo-ia
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    devices:
      - "/dev/video0:/dev/video0"       # Cámara USB en entornos Linux
      - "/dev/ttyUSB0:/dev/ttyUSB0"     # Puerto Serial Arduino en Linux (/dev/ttyACM0 si aplica)